[project]
name = "gitverse-backend"
version = "0.1.0"
description = "GitVerse analysis API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.162,<1",
    "pydantic-settings>=2.16,<3",
    "uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=2.4,<3",
    "pytest>=9.2,<10",
    "ruff>=0.17,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
